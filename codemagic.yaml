workflows:
  ios-testflight:
    name: iOS TestFlight (signed)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: JoT9
    environment:
      vars:
        BUNDLE_ID: com.jo1project.t9bopomofo
        BUNDLE_ID_KEYBOARD: com.jo1project.t9bopomofo.keyboard
        XCODE_PROJECT: T9Bopomofo.xcodeproj
        XCODE_SCHEME: T9Bopomofo
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: cursor/app-polish-sponsor-99f2
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Download librime + models
        script: |
          chmod +x Scripts/download-frameworks.sh Scripts/download-models.sh
          ./Scripts/download-frameworks.sh
          ./Scripts/download-models.sh
      - name: Generate Xcode project
        script: |
          xcodegen generate
          ls -la "$XCODE_PROJECT"
      - name: Set up code signing
        script: |
          # Uses Codemagic ↔ App Store Connect integration to fetch/create
          # Distribution certs + profiles for app + keyboard extension.
          xcode-project use-profiles --verbose

          # Verify profiles were fetched
          echo "=== Available provisioning profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles directory"

          echo "=== Keychain identities ==="
          security find-identity -v -p codesigning
      - name: Incremental build number (optional)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo "0")
          NEW=$((LATEST + 1))
          echo "CFBundleVersion -> $NEW"

          # Update App Info.plist
          plutil -replace CFBundleVersion -string "$NEW" T9Bopomofo/App/Info.plist
          plutil -replace CFBundleShortVersionString -string "0.3.9" T9Bopomofo/App/Info.plist

          # Update Keyboard Info.plist - ensure version matches
          if [ -f T9Bopomofo/Keyboard/Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW" T9Bopomofo/Keyboard/Info.plist \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEW" T9Bopomofo/Keyboard/Info.plist \
              || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.3.9" T9Bopomofo/Keyboard/Info.plist \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 0.3.9" T9Bopomofo/Keyboard/Info.plist \
              || true
          fi

          echo "App version: 0.3.9 ($NEW)"
          echo "Keyboard version: 0.3.9 ($NEW)"
      - name: Build ipa
        script: |
          # Create export options
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>S24Z424MU4</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
          </dict>
          </plist>
          EOF

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config "Release" \
            --archive-flags="-allowProvisioningUpdates" \
            --export-options-plist=/tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testing only until screenshots/metadata ready
        submit_to_app_store: false
