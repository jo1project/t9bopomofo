workflows:
  ios-testflight:
    name: iOS TestFlight (signed)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: JoT9
    environment:
      vars:
        BUNDLE_ID: com.jo1project.t9bopomofo
        BUNDLE_ID_KEYBOARD: com.jo1project.t9bopomofo.keyboard
        XCODE_PROJECT: T9Bopomofo.xcodeproj
        XCODE_SCHEME: T9Bopomofo
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: cursor/app-polish-sponsor-99f2
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Download librime + models
        script: |
          chmod +x Scripts/download-frameworks.sh Scripts/download-models.sh
          ./Scripts/download-frameworks.sh
          ./Scripts/download-models.sh
      - name: Generate Xcode project
        script: |
          xcodegen generate
          ls -la "$XCODE_PROJECT"
      - name: Set up App Store Connect authentication
        script: |
          # Prepare API key for xcodebuild automatic signing
          mkdir -p ~/private_keys

          # Codemagic integration provides these env vars
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8

          echo "✓ API Key ID: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          echo "✓ Issuer ID: $APP_STORE_CONNECT_ISSUER_ID"
          echo "✓ Team ID: S24Z424MU4"
      - name: Incremental build number (optional)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo "0")
          NEW=$((LATEST + 1))
          echo "CFBundleVersion -> $NEW"

          # Update App Info.plist
          plutil -replace CFBundleVersion -string "$NEW" T9Bopomofo/App/Info.plist
          plutil -replace CFBundleShortVersionString -string "0.3.9" T9Bopomofo/App/Info.plist

          # Update Keyboard Info.plist - ensure version matches
          if [ -f T9Bopomofo/Keyboard/Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW" T9Bopomofo/Keyboard/Info.plist \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEW" T9Bopomofo/Keyboard/Info.plist \
              || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.3.9" T9Bopomofo/Keyboard/Info.plist \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 0.3.9" T9Bopomofo/Keyboard/Info.plist \
              || true
          fi

          echo "App version: 0.3.9 ($NEW)"
          echo "Keyboard version: 0.3.9 ($NEW)"
      - name: Archive with automatic signing
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/xcarchive/T9Bopomofo.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=S24Z424MU4
      - name: Export IPA
        script: |
          # Create export options
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>S24Z424MU4</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/T9Bopomofo.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testing only until screenshots/metadata ready
        submit_to_app_store: false
