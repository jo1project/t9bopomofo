name: T9Bopomofo
options:
  bundleIdPrefix: com.jo1project
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  BASE:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: S24Z424MU4
    MARKETING_VERSION: "0.3.9"
    CURRENT_PROJECT_VERSION: "82"

targets:
  T9Bopomofo:
    type: application
    platform: iOS
    sources:
      - path: T9Bopomofo/App
      - path: T9Bopomofo/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jo1project.t9bopomofo
      INFOPLIST_FILE: T9Bopomofo/App/Info.plist
      CODE_SIGN_ENTITLEMENTS: T9Bopomofo/App/App.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: S24Z424MU4
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: ""
      MARKETING_VERSION: "0.3.9"
      CURRENT_PROJECT_VERSION: "82"
    dependencies:
      - target: T9Keyboard
        embed: true
        codeSign: false
      - sdk: StoreKit.framework
      - sdk: Security.framework

  T9Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: T9Bopomofo/Keyboard
      - path: T9Bopomofo/Shared
      - path: Resources/chewing
        buildPhase: resources
        type: folder
      - path: Resources/layouts
        buildPhase: resources
        type: folder
    prebuildScripts:
      - name: Generate sharded lexicon-*.bin
        inputFiles:
          - $(SRCROOT)/Resources/chewing/chewing_base.dict.yaml
          - $(SRCROOT)/Resources/chewing/taiwan_phrases.dict.yaml
          - $(SRCROOT)/T9Bopomofo/Shared/Models/LexiconEntry.swift
          - $(SRCROOT)/T9Bopomofo/Shared/Engine/T9KeyMap.swift
          - $(SRCROOT)/T9Bopomofo/Shared/Engine/SyllableCodec.swift
          - $(SRCROOT)/T9Bopomofo/Shared/Engine/DictionaryLoader.swift
          - $(SRCROOT)/Scripts/generate_lexicon_main.swift
        outputFiles:
          - $(SRCROOT)/Resources/chewing/lexicon-0.bin
          - $(SRCROOT)/Resources/chewing/lexicon-1.bin
          - $(SRCROOT)/Resources/chewing/lexicon-2.bin
          - $(SRCROOT)/Resources/chewing/lexicon-3.bin
          - $(SRCROOT)/Resources/chewing/lexicon-4.bin
          - $(SRCROOT)/Resources/chewing/lexicon-5.bin
          - $(SRCROOT)/Resources/chewing/lexicon-6.bin
          - $(SRCROOT)/Resources/chewing/lexicon-7.bin
          - $(SRCROOT)/Resources/chewing/lexicon-8.bin
          - $(SRCROOT)/Resources/chewing/lexicon-9.bin
          - $(SRCROOT)/Resources/chewing/lexicon-v.bin
        script: |
          set -euo pipefail
          GEN_SRC="$DERIVED_FILE_DIR/generate_lexicon.swift"
          GEN_BIN="$DERIVED_FILE_DIR/generate_lexicon"
          mkdir -p "$DERIVED_FILE_DIR"

          # Concatenate the real runtime sources (not copies) so this generator can never
          # drift from what DictionaryLoader actually does at runtime.
          cat "$SRCROOT/T9Bopomofo/Shared/Models/LexiconEntry.swift" \
              "$SRCROOT/T9Bopomofo/Shared/Engine/T9KeyMap.swift" \
              "$SRCROOT/T9Bopomofo/Shared/Engine/SyllableCodec.swift" \
              "$SRCROOT/T9Bopomofo/Shared/Engine/DictionaryLoader.swift" \
              "$SRCROOT/Scripts/generate_lexicon_main.swift" > "$GEN_SRC"

          # This target's build environment sets SDKROOT to the iOS SDK, but we're
          # compiling a tool to run on the Mac build host right here — override it
          # explicitly or swiftc tries to load the macOS stdlib from the iOS SDK path.
          MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          swiftc -sdk "$MACOS_SDK" -O "$GEN_SRC" -o "$GEN_BIN"

          "$GEN_BIN" \
              "$SRCROOT/Resources/chewing/chewing_base.dict.yaml" \
              "$SRCROOT/Resources/chewing/taiwan_phrases.dict.yaml" \
              "$SRCROOT/Resources/chewing"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jo1project.t9bopomofo.keyboard
      INFOPLIST_FILE: T9Bopomofo/Keyboard/Info.plist
      CODE_SIGN_ENTITLEMENTS: T9Bopomofo/Keyboard/Keyboard.entitlements
      DEVELOPMENT_TEAM: S24Z424MU4
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: ""
      SKIP_INSTALL: YES
      MARKETING_VERSION: "0.3.9"
      CURRENT_PROJECT_VERSION: "82"
    dependencies:
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: StoreKit.framework
      - sdk: UIKit.framework
    info:
      path: T9Bopomofo/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Jo一個T9注音
        NSExtension:
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hant
            RequestsOpenAccess: true

schemes:
  T9Bopomofo:
    build:
      targets:
        T9Bopomofo: all
        T9Keyboard: all
    run:
      config: Debug
      storeKitConfiguration: T9Bopomofo/App/Configuration.storekit
    archive:
      config: Release
