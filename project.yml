name: T9Bopomofo
options:
  bundleIdPrefix: com.jo1project
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  BASE:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: S24Z424MU4
    MARKETING_VERSION: "0.3.9"
    CURRENT_PROJECT_VERSION: "67"

targets:
  T9Bopomofo:
    type: application
    platform: iOS
    sources:
      - path: T9Bopomofo/App
      - path: T9Bopomofo/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jo1project.t9bopomofo
      INFOPLIST_FILE: T9Bopomofo/App/Info.plist
      CODE_SIGN_ENTITLEMENTS: T9Bopomofo/App/App.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: S24Z424MU4
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: ""
      MARKETING_VERSION: "0.3.9"
      CURRENT_PROJECT_VERSION: "67"
    dependencies:
      - target: T9Keyboard
        embed: true
        codeSign: false
      - sdk: StoreKit.framework
      - sdk: Security.framework

  T9Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: T9Bopomofo/Keyboard
      - path: T9Bopomofo/Shared
      - path: Resources/chewing
        buildPhase: resources
        type: folder
      - path: Resources/layouts
        buildPhase: resources
        type: folder
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jo1project.t9bopomofo.keyboard
      INFOPLIST_FILE: T9Bopomofo/Keyboard/Info.plist
      CODE_SIGN_ENTITLEMENTS: T9Bopomofo/Keyboard/Keyboard.entitlements
      DEVELOPMENT_TEAM: S24Z424MU4
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: ""
      SKIP_INSTALL: YES
      MARKETING_VERSION: "0.3.9"
      CURRENT_PROJECT_VERSION: "67"
    dependencies:
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: StoreKit.framework
      - sdk: UIKit.framework
    info:
      path: T9Bopomofo/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Jo一個T9注音
        NSExtension:
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hant
            RequestsOpenAccess: true

schemes:
  T9Bopomofo:
    build:
      targets:
        T9Bopomofo: all
        T9Keyboard: all
    run:
      config: Debug
      storeKitConfiguration: T9Bopomofo/App/Configuration.storekit
    archive:
      config: Release
