name: Bench (temp, remove before merging)

on:
  push:
    branches:
      - bench/baseline
      - perf/review-fixes

permissions:
  contents: read

jobs:
  bench:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Baseline benchmarks
        run: |
          set -euo pipefail
          S=T9Bopomofo/Shared
          YAMLS="Resources/chewing/chewing_base.dict.yaml Resources/chewing/taiwan_phrases.dict.yaml"

          cat $S/Models/LexiconEntry.swift $S/Engine/T9KeyMap.swift $S/Engine/SyllableCodec.swift \
              $S/Engine/DictionaryLoader.swift $S/Storage/UserLexicon.swift \
              Scripts/bench_baseline_main.swift > "$RUNNER_TEMP/bench_baseline.swift"
          swiftc -O "$RUNNER_TEMP/bench_baseline.swift" -o "$RUNNER_TEMP/bench_baseline"
          "$RUNNER_TEMP/bench_baseline" $YAMLS

          cat $S/Models/LexiconEntry.swift $S/Engine/T9KeyMap.swift $S/Engine/SyllableCodec.swift \
              $S/Engine/DictionaryLoader.swift $S/Engine/PhraseSegmenter.swift $S/Engine/FuzzyMatcher.swift \
              Scripts/bench_keystroke_main.swift > "$RUNNER_TEMP/bench_keystroke.swift"
          swiftc -O "$RUNNER_TEMP/bench_keystroke.swift" -o "$RUNNER_TEMP/bench_keystroke"
          "$RUNNER_TEMP/bench_keystroke" base $YAMLS
