name: Bench Lexicon Load

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::No Xcode.app found"
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          swift --version

      - name: Build and run lexicon load benchmark
        run: |
          set -euo pipefail
          GEN_SRC="$RUNNER_TEMP/bench_lexicon.swift"
          GEN_BIN="$RUNNER_TEMP/bench_lexicon"
          cat T9Bopomofo/Shared/Models/LexiconEntry.swift \
              T9Bopomofo/Shared/Engine/T9KeyMap.swift \
              T9Bopomofo/Shared/Engine/SyllableCodec.swift \
              T9Bopomofo/Shared/Engine/DictionaryLoader.swift \
              Scripts/bench_lexicon_main.swift > "$GEN_SRC"
          swiftc -O "$GEN_SRC" -o "$GEN_BIN"
          "$GEN_BIN" \
              Resources/chewing/chewing_base.dict.yaml \
              Resources/chewing/taiwan_phrases.dict.yaml
