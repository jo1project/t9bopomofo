name: Build and Upload to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download librime + models
        run: |
          chmod +x Scripts/download-frameworks.sh Scripts/download-models.sh
          ./Scripts/download-frameworks.sh
          ./Scripts/download-models.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate and provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_KEYBOARD_BASE64: ${{ secrets.PROVISIONING_PROFILE_KEYBOARD_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Set up API key
          mkdir -p ~/private_keys
          echo "$API_KEY_CONTENT" > ~/private_keys/AuthKey_${API_KEY_ID}.p8

          # Decode certificate and profiles
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH="$RUNNER_TEMP/main.mobileprovision"
          KEYBOARD_PROFILE_PATH="$RUNNER_TEMP/keyboard.mobileprovision"
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          echo "$PROVISIONING_PROFILE_KEYBOARD_BASE64" | base64 --decode > "$KEYBOARD_PROFILE_PATH"

          # Create keychain and import certificate
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          cp "$KEYBOARD_PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          # Get profile UUIDs
          MAIN_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          KEYBOARD_UUID=$(security cms -D -i "$KEYBOARD_PROFILE_PATH" | plutil -extract UUID raw -)

          echo "MAIN_PROFILE_UUID=$MAIN_UUID" >> $GITHUB_ENV
          echo "KEYBOARD_PROFILE_UUID=$KEYBOARD_UUID" >> $GITHUB_ENV

          echo "✓ Certificate and profiles installed"
          echo "  Main UUID: $MAIN_UUID"
          echo "  Keyboard UUID: $KEYBOARD_UUID"

      - name: Increment build number
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Get latest build number from TestFlight
          LATEST=$(xcrun altool --list-apps \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID" 2>/dev/null | grep "com.jo1project.t9bopomofo" | head -1 | awk '{print $NF}' || echo "0")

          NEW=$((LATEST + 1))
          echo "Build number: $NEW"

          # Update Info.plist files
          plutil -replace CFBundleVersion -string "$NEW" T9Bopomofo/App/Info.plist
          plutil -replace CFBundleShortVersionString -string "0.3.9" T9Bopomofo/App/Info.plist

          plutil -replace CFBundleVersion -string "$NEW" T9Bopomofo/Keyboard/Info.plist
          plutil -replace CFBundleShortVersionString -string "0.3.9" T9Bopomofo/Keyboard/Info.plist

          echo "Updated to version 0.3.9 ($NEW)"

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project T9Bopomofo.xcodeproj \
            -scheme T9Bopomofo \
            -configuration Release \
            -archivePath $RUNNER_TEMP/T9Bopomofo.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=S24Z424MU4 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$MAIN_PROFILE_UUID"

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>S24Z424MU4</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.jo1project.t9bopomofo</key>
                  <string>$MAIN_PROFILE_UUID</string>
                  <key>com.jo1project.t9bopomofo.keyboard</key>
                  <string>$KEYBOARD_PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/T9Bopomofo.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/T9Bopomofo.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: T9Bopomofo-ipa
          path: ${{ runner.temp }}/export/*.ipa
